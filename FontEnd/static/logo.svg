<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Cercle de fond doré -->
  <circle cx="100" cy="100" r="95" fill="#d4af37" opacity="0.15"/>
  
  <!-- Cercle intérieur bordeaux -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#7f1d1d" stroke-width="3"/>
  
  <!-- Table (surface) - bordeaux -->
  <ellipse cx="100" cy="120" rx="45" ry="12" fill="#7f1d1d"/>
  
  <!-- Pied de table - bordeaux -->
  <rect x="95" y="110" width="10" height="35" fill="#7f1d1d" rx="2"/>
  
  <!-- Fourchette (gauche) - doré -->
  <g transform="translate(65, 70)">
    <line x1="5" y1="0" x2="5" y2="35" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="0" x2="2" y2="12" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="0" x2="5" y2="12" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="8" y2="12" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Couteau (droite) - doré -->
  <g transform="translate(125, 70)">
    <line x1="5" y1="0" x2="5" y2="35" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
    <path d="M 3 0 L 7 0 L 7 8 L 5 10 L 3 8 Z" fill="#d4af37"/>
  </g>
  
  <!-- Lettre "TF" stylisée au centre - bordeaux et doré -->
  <text x="100" y="95" font-family="serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#7f1d1d">T</text>
  <text x="100" y="95" font-family="serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#d4af37" opacity="0.3">T</text>
  
  <!-- Étoile décorative en haut - doré -->
  <path d="M 100 25 L 102 32 L 109 32 L 103 37 L 105 44 L 100 39 L 95 44 L 97 37 L 91 32 L 98 32 Z" fill="#d4af37"/>
</svg>
